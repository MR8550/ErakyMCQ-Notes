is"},"a":"E","b":[120],"lec":"t1"},{"n":170,"q":"A 22-year-old Hispanic man presents to the emergency department with jaundice and abdominal pain. Clinical examina tion reveals no stigmata of chronic liver disease. The patient notes he works as an emergency medical technician and had a needle stick injury approximately 5 weeks ago for which he did not file a report or seek medical attention. He drinks 3 beers daily and more on the weekends. His history is notable for vaccination to hepatitis A virus and hepatitis B virus. Laboratory results are shown below. Which of the following laboratory tests should you order next?","o":{"A":"Alcohol level","B":"Antinuclear antibodies","C":"Hepatitis A IgG","D":"Hepatitis C viral load by polymerase chain reaction","E":"Iron level"},"a":"D","b":[33],"lec":"t45"},{"n":171,"q":"A 23-year-old Black man presents to the clinic with complaint of fever, cough, malaise, and sore throat. His symptoms have been ongoing for approximately 2 weeks. He has no past medical history and is otherwise healthy. He has no recent travel and denies contact with sick persons. He is vaccinated for hepatitis A and B viruses. Computed tomography of the abdomen is normal. Laboratory results are below. What diagnostic test is indicated now?","o":{"A":"Blood cultures","B":"Ceruloplasmin","C":"Cytomegalovirus IgM","D":"Hepatitis E viral load"},"a":"C","b":[58],"lec":"t45"}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const LEC=Object.fromEntries(D.lecs.map(l=>[l.id,l]));
const BQ=D.qs;const QBY=Object.fromEntries(BQ.map(q=>[q.n,q]));
let ST={};try{ST=JSON.parse(localStorage.getItem('st')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('st',JSON.stringify(ST))}catch(e){}};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#theme').onclick=()=>{const c=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const n=c==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}};
$('#menu').onclick=()=>$('#nav').classList.toggle('show');
const bl=id=>D.blocks.filter(b=>b.lec===id),ql=id=>BQ.filter(q=>q.lec===id);
function nav(cur){
  const g={GIT:'GIT',TROP:'Tropical',OTHER:'زيادات تانية'};let h='<a href="#bank" class="'+(cur==='bank'?'on':'')+'"><span>📚 بنك كل الأسئلة</span><span class="cnt">'+BQ.length+' سؤال</span></a>';
  for(const k of Object.keys(g)){h+='<h3>'+g[k]+'</h3>';for(const l of D.lecs.filter(x=>x.g===k)){const nb=bl(l.id).length,nq=ql(l.id).length;
    h+='<a href="#'+l.id+'" class="'+(cur===l.id?'on ':'')+(nb+nq?'':'zero')+'"><span>'+l.t+'</span><span class="cnt">'+nb+' 📄 · '+nq+' ❓</span></a>';}}
  $('#nav').innerHTML=h;$('#nav').classList.remove('show');
}
function nodes(ns){return ns.map(n=>{
  if(n.k==='c')return '<div class="co '+(n.label==='IMPORTANT'?'im':'')+'"><div class="lb">'+(n.label==='IMPORTANT'?'IMPORTANT':'MCQ POINT')+'</div>'+n.h+'</div>';
  if(n.k==='sub')return '<div class="n sub">'+n.h+'</div>';
  if(n.k==='cap')return '<div class="cap">🖼 '+n.h+'</div>';
  return '<div class="n l'+n.l+(n.bu?' b':'')+'">'+n.h+'</div>';}).join('');}
function block(b,open,showq=true){
  const qc=showq&&b.q.length?'<span class="chips">'+b.q.slice(0,6).map(n=>'<a class="chip" href="#q'+n+'">Q'+n+'</a>').join('')+'</span>':'';
  return '<details class="card" '+(open?'open':'')+' id="'+b.id+'"><summary><span class="ttl">'+esc(b.h)+'<span class="src">'+esc(b.doc)+' · p.'+b.pg+'</span></span>'+qc+'</summary><div class="body">'+nodes(b.nodes)+'</div></details>';}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function question(q,reveal){
  const s=ST[q.n];const done=s!==undefined;
  let h='<div class="card q" id="q'+q.n+'"><div class="qh"><span>سؤال '+q.n+'</span><span>'+(LEC[q.lec]?LEC[q.lec].t:'')+'</span></div><div class="qt">'+esc(q.q)+'</div>';
  for(const k of Object.keys(q.o)){let c='';if(done||reveal){if(k===q.a)c='ok';else if(k===s)c='no'}
    h+='<button class="opt '+c+'" data-q="'+q.n+'" data-k="'+k+'" '+(done||reveal?'disabled':'')+'><i>'+k+'</i><span>'+esc(q.o[k])+'</span></button>';}
  if(done||reveal){const ok=s===q.a;h+='<div class="ans"><div class="v '+(done?(ok?'g':'r'):'g')+'">'+(done?(ok?'✅ إجابة صح':'❌ إجابة غلط – الصح: '+q.a):'الإجابة الصح: '+q.a)+'</div>';
    h+='<div class="st" style="color:var(--mute);font-size:13px">المعلومة من نوتس الدكتور (مربوطة تلقائيًا بأقرب موضوع):</div>';
    h+=q.b.map(i=>'<div class="info">'+block(D.blocks[i],true,false).replace('class="card"','class="card" style="border:0;box-shadow:none;margin:0"')+'</div>').join('')+'</div>';}
  else h+='<div style="margin-top:8px"><button class="btn" data-show="'+q.n+'">اعرض الإجابة والمعلومة</button></div>';
  return h+'</div>';}
function bar(list){const d=list.filter(q=>ST[q.n]!==undefined),r=d.filter(q=>ST[q.n]===q.a).length;
  return '<div class="bar"><span>اتحل <span class="score">'+d.length+'/'+list.length+'</span></span><span>صح <span class="score" style="color:var(--ok)">'+r+'</span></span><span>غلط <span class="score" style="color:var(--bad)">'+(d.length-r)+'</span></span><button class="btn" data-reset="1">إعادة الحل</button></div>';}
let SHOWN=new Set();
function view(){
  const hs=location.hash.slice(1)||'g1';SHOWN=new Set();
  let m='';
  if(/^q\d+$/.test(hs)){const q=QBY[hs.slice(1)];if(q){location.replace('#'+q.lec+'-q');return}}
  if(hs==='bank'||hs.endsWith('-q')){
    const id=hs==='bank'?null:hs.slice(0,-2);const list=id?ql(id):BQ;nav(hs==='bank'?'bank':id);
    m='<div class="hero"><h2>'+(id?LEC[id].t:'بنك كل الأسئلة ('+BQ.length+')')+'</h2><p>اختار إجابة وهتظهر لك الصح فورًا مع المعلومة اللي قالها الدكتور عن الموضوع ده.</p></div>';
    if(id)m+='<div class="tabs"><a class="tab" href="#'+id+'">📖 المعلومات ('+bl(id).length+')</a><a class="tab on" href="#'+id+'-q">📝 الأسئلة ('+list.length+')</a></div>';
    m+=bar(list)+(list.length?list.map(q=>question(q)).join(''):'<div class="empty">مفيش أسئلة مربوطة بالمحاضرة دي.</div>');
  }else{
    const id=LEC[hs]?hs:'g1';nav(id);const l=LEC[id];const bs=bl(id);
    m='<div class="hero"><h2>'+l.t+'</h2><p>'+l.ar+' — '+bs.length+' موضوع من نوتس الدكتور</p></div><div class="tabs"><a class="tab on" href="#'+id+'">📖 المعلومات ('+bs.length+')</a><a class="tab" href="#'+id+'-q">📝 الأسئلة ('+ql(id).length+')</a><button class="btn" data-all="1">فتح/قفل الكل</button></div>';
    m+=bs.length?bs.map(b=>block(b,true)).join(''):'<div class="empty">مفيش معلومات زيادة من الدكتور على المحاضرة دي في الملف اللي اتبعت.</div>';
  }
  $('#main').innerHTML=m;scrollTo(0,0);
}
function search(t){
  t=t.trim().toLowerCase();if(t.length<2){view();return}nav('');
  const bs=D.blocks.filter(b=>(b.h+' '+b.nodes.map(n=>n.t).join(' ')).toLowerCase().includes(t));
  const qs=BQ.filter(q=>(q.q+' '+Object.values(q.o).join(' ')).toLowerCase().includes(t));
  $('#main').innerHTML='<div class="hero"><h2>نتائج “'+esc(t)+'”</h2><p>'+bs.length+' موضوع · '+qs.length+' سؤال</p></div>'+bs.slice(0,40).map(b=>'<div class="note">'+(LEC[b.lec]?LEC[b.lec].t:'')+'</div>'+block(b,true)).join('')+qs.slice(0,30).map(q=>question(q)).join('')+(bs.length+qs.length?'':'<div class="empty">مفيش نتائج.</div>');
}
document.addEventListener('click',e=>{
  const o=e.target.closest('.opt');if(o&&!o.disabled){ST[o.dataset.q]=o.dataset.k;save();rerender(o.dataset.q);return}
  const s=e.target.closest('[data-show]');if(s){rerender(s.dataset.show,true);return}
  if(e.target.closest('[data-reset]')){if(confirm('تمسح نتايج الحل كلها؟')){ST={};save();view()}return}
  if(e.target.closest('[data-all]')){const ds=[...document.querySelectorAll('main details.card')];const op=ds.some(d=>!d.open);ds.forEach(d=>d.open=op)}
  if(e.target.closest('nav a'))$('#nav').classList.remove('show');
});
function rerender(n,rev){const q=QBY[n];const el=document.getElementById('q'+n);if(!el)return;const t=document.createElement('div');t.innerHTML=question(q,rev);el.replaceWith(t.firstChild);
  const b=document.querySelector('.bar');if(b){const hs=location.hash.slice(1);const id=hs.endsWith('-q')?hs.slice(0,-2):null;b.outerHTML=bar(id?ql(id):BQ)}}
$('#s').addEventListener('input',e=>search(e.target.value));
addEventListener('hashchange',()=>{$('#s').value='';view()});
view();
</script>
</body>
</html>
